name: V7 checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests scripts evaluation
      - run: python -m ruff format --check app tests scripts evaluation
      - run: python -m pytest -q
