name: FootyPreds checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest==8.1.1 ruff==0.15.7
      - run: python -m ruff check footypreds
      - run: python -m ruff format --check footypreds
      - run: python -m pytest -q
